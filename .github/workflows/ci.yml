name: "ci"

concurrency:
  group: "${{github.workflow}}-${{github.ref}}"
  cancel-in-progress: true

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 5" # At 08:00 on Friday # https://crontab.guru/#0_8_*_*_5
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize]
    branches:
      - main

jobs:
  rubocop:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: "4.0"
        bundler-cache: true
    - run: bundle exec rake rubocop

  test:
    name: "test (${{matrix.ruby-version}})"
    needs: ["rubocop"]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { ruby-version: "2.6", runs-on: "ubuntu-24.04" }
          - { ruby-version: "2.7", runs-on: "ubuntu-24.04" }
          - { ruby-version: "3.0", runs-on: "ubuntu-24.04" }
          - { ruby-version: "3.1", runs-on: "ubuntu-24.04" }
          - { ruby-version: "3.2", runs-on: "ubuntu-latest" }
          - { ruby-version: "3.3", runs-on: "ubuntu-latest" }
          - { ruby-version: "3.4", runs-on: "ubuntu-latest" }
          - { ruby-version: "4.0", runs-on: "ubuntu-latest" }
    runs-on: ${{matrix.runs-on}}
    steps:
    - uses: actions/checkout@v4
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{matrix.ruby-version}}
        bundler-cache: true
    - run: bundle exec rake test
